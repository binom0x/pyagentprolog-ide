[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagentprolog-ide"
version = "0.1.0"
description = "Web IDE for PyAgentProlog"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyagentprolog>=1.0.1",
    "gradio>=4.0",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Andrey Vorfolomeev", email = "binom0x@proton.me"}
]
keywords = ["prolog", "logic-programming", "ai", "IDE"]
[project.optional-dependencies]
semantic = ["pyagentprolog[semantic]"]

[project.scripts]
pyagentprolog-ide = "pyagentprolog_ide.__main__:main"

[tool.setuptools.packages.find]
include = ["pyagentprolog_ide*"]

[tool.setuptools.package-data]
pyagentprolog_ide = ["examples/**/*.pl"]